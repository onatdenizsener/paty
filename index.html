<style>
:root{--ink:#1a1c2c;--plum:#5d275d;--red:#b13e53;--orange:#ef7d57;--yellow:#ffcd75;--lime:#a7f070;--green:#38b764;--teal:#257179;
  --navy:#29366f;--blue:#3b5dc9;--sky:#41a6f6;--cyan:#73eff7;--white:#f4f4f4;--mist:#94b0c2;--slate:#566c86;--shadow:#333c57;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#12131f;color:var(--white);font-family:'Pixelify Sans',monospace;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{min-height:100vh;display:flex;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));background-image:radial-gradient(#1e2033 1px,transparent 1px);background-size:6px 6px}
#app{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
img,canvas{image-rendering:pixelated}

.device{background:var(--plum);border:4px solid var(--ink);border-radius:16px 16px 34px 16px;padding:10px;
  box-shadow:inset -6px -6px 0 #3e1a3e,inset 4px 4px 0 #7a3a7a,0 6px 0 #0b0c14}
.top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.lvl{display:flex;align-items:center;gap:5px;background:var(--ink);border:2px solid #000;border-radius:4px;padding:3px 7px;flex:1;min-width:0}
.lvl img{width:16px;height:16px}
.lvl b{font-size:14px;white-space:nowrap}
.xp{flex:1;height:7px;background:#333c57;border:1px solid #000;min-width:30px}
.xp i{display:block;height:100%;background:var(--yellow)}
.chip{background:var(--ink);border:2px solid #000;padding:3px 7px;border-radius:4px;display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:14px}
.chip img{width:14px;height:14px}

.screen{position:relative;border:4px solid var(--ink);border-radius:6px;overflow:hidden;background:#000}
#room{display:block;width:100%;aspect-ratio:4/3;cursor:pointer;touch-action:manipulation}
.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.1) 3px)}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--ink);color:var(--yellow);border:2px solid var(--yellow);
  padding:3px 10px;border-radius:4px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}

.tabs{display:flex;gap:6px;margin-top:8px}
.tab{flex:1;background:#3e1a3e;border:2px solid var(--ink);border-radius:4px;padding:4px;font-size:13px;text-align:center;cursor:pointer;color:var(--mist)}
.tab.on{background:var(--yellow);color:var(--ink);font-weight:700}
.tab.lock{opacity:.6}

.talk{display:flex;gap:9px;align-items:flex-start;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:6px;
  padding:8px 10px;margin-top:8px;min-height:80px;cursor:pointer;position:relative;box-shadow:3px 3px 0 var(--ink)}
.talk.quiet{background:#d8d4c8}
.talk canvas{width:48px;height:36px;flex:none;background:var(--cyan);border:2px solid var(--ink);border-radius:4px}
.talk.quiet canvas{background:var(--mist)}
.talk .who{font-weight:700;color:var(--red);font-size:13px}
.talk.quiet .who{color:var(--slate)}
.talk .txt{font-size:15px;line-height:1.25;min-height:38px}
.talk .next{position:absolute;right:8px;bottom:4px;font-size:12px;animation:blink 1s steps(2) infinite}
.choices{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.choices button{flex-direction:row;padding:5px 12px;font-size:14px}
@keyframes blink{50%{opacity:0}}

.panel{background:var(--navy);border:3px solid var(--ink);border-radius:6px;padding:9px;box-shadow:3px 3px 0 var(--ink);min-height:120px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.phead>img{width:46px;height:auto}
.pname{font-weight:700;font-size:19px;line-height:1}
.ptrait{font-size:12px;color:var(--cyan);margin-top:2px}
.hearts{display:flex;gap:2px;margin-top:3px}
.hearts img{width:11px;height:10px}
.chips{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
.pchip{width:34px;height:34px;background:var(--ink);border:2px solid #000;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.pchip img{width:26px}
.pchip.on{border-color:var(--yellow)}
.pchip .dot{position:absolute;right:-3px;top:-3px;width:9px;height:9px;background:var(--red);border:1px solid #000;border-radius:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.st{display:flex;align-items:center;gap:5px;font-size:12px}
.st img{width:13px;height:13px;flex:none}
.st span{width:58px;flex:none}
.st .b{flex:1;height:9px;background:var(--ink);border:1px solid #000}
.st .b i{display:block;height:100%}
.pextra{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pextra button{flex:1;flex-direction:row;justify-content:center;font-size:13px;padding:5px 6px;box-shadow:0 3px 0 var(--ink);min-width:110px}
.pextra button img{width:14px;height:14px}
.lostbox{font-size:14px;line-height:1.35;color:var(--yellow)}
.empty{font-size:14px;color:var(--mist);line-height:1.4;padding:6px 0}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:6px;
  padding:7px 4px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .05s;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button img{width:22px;height:22px}
button.c2{background:#f29bb2}button.c3{background:var(--cyan)}button.c4{background:var(--lime)}button.dark{background:var(--mist)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row button{font-size:12px}
.row button img{width:18px;height:18px}
.pulse{animation:pulse .8s ease-in-out infinite;position:relative;z-index:2}
@keyframes pulse{0%,100%{outline:3px solid var(--yellow);outline-offset:2px}50%{outline:3px solid #fff;outline-offset:5px}}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:4px;font-size:11px;padding:0 4px}

.modal{position:fixed;inset:0;background:rgba(10,10,20,.78);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}
.modal.open{display:flex}
.box{background:var(--white);color:var(--ink);border:4px solid var(--ink);border-radius:8px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:6px 6px 0 #000;padding:12px}
.box h2{font-size:21px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h2 button{flex-direction:row;padding:2px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.box h3{font-size:13px;color:var(--slate);margin:10px 0 2px;text-transform:uppercase;letter-spacing:1px}
.item{display:flex;align-items:center;gap:10px;border-bottom:2px dashed #cfcabc;padding:7px 0}
.item>img{width:42px;height:42px;background:#e6e0d0;border:2px solid var(--ink);border-radius:4px;object-fit:contain;padding:3px;flex:none}
.item .d{flex:1;font-size:13px;line-height:1.25}
.item .d b{font-size:15px}
.item .d small{color:var(--slate)}
.item button{flex-direction:row;min-width:74px;justify-content:center;font-size:13px}
.item button img{width:12px;height:12px}
.prog{height:8px;background:#cfcabc;border:1px solid var(--ink);margin-top:4px}
.prog i{display:block;height:100%;background:var(--green)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick3{grid-template-columns:1fr 1fr 1fr}
.pc{border:3px solid var(--ink);border-radius:6px;background:#e6e0d0;padding:8px;text-align:center;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.pc.on{background:var(--yellow);outline:3px solid var(--red)}
.pc img{width:80%;max-width:110px;margin:6px auto;display:block}
.pc b{font-size:16px;display:block}
.pc small{font-size:12px;color:var(--slate);display:block;line-height:1.2;margin-top:3px}
.namerow{display:flex;gap:8px;margin-top:8px}
.namerow input{flex:1;font-family:inherit;font-size:20px;padding:6px 10px;border:3px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
.namerow button{flex-direction:row}
.foot{display:flex;gap:8px;margin-top:12px}
.foot button{flex:1;flex-direction:row;justify-content:center;font-size:16px}
#park,#kick{width:100%;aspect-ratio:4/3;border:3px solid var(--ink);border-radius:4px;cursor:pointer;display:block;touch-action:none}
.hint{margin-top:8px;font-size:15px;min-height:40px;text-align:center;line-height:1.3}
.ad{text-align:center;font-size:18px;padding:20px 0}
.ad .big{font-size:48px;font-weight:700;color:var(--red)}
.note{font-size:12px;color:var(--slate);line-height:1.4;margin-top:8px}
.dev{display:flex;gap:6px;flex-wrap:wrap}
.dev button{flex-direction:row;font-size:12px;padding:5px 8px;box-shadow:0 3px 0 var(--ink)}
.dev button.on{background:var(--lime)}

.title{position:absolute;inset:0;background:rgba(26,28,44,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5}
.title h1{font-size:56px;color:var(--yellow);text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--ink);letter-spacing:2px;line-height:1}
.title p{font-size:13px;color:var(--cyan)}
.title img{width:72px;animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-8px)}}
.title button{flex-direction:row;font-size:18px;padding:8px 26px}
.hidden{display:none!important}
.sgrid{grid-template-columns:repeat(3,1fr);gap:8px}
.pc.sp{padding:6px 4px}.pc.sp>img{width:70%;height:54px;object-fit:contain}
.pc.sp b{font-size:14px}.pc.locked{opacity:.45;filter:grayscale(.7);cursor:not-allowed}
.pc.ex{background:linear-gradient(160deg,#fff2b0,#ffcd75);border-color:#8b6a1c}
.exh{color:#b5841f!important}
img.lk,.pc small img{width:10px;height:10px;display:inline;margin:0;vertical-align:middle}
.exb{font-size:10px;background:var(--yellow);color:var(--ink);padding:1px 4px;border-radius:3px;vertical-align:middle;border:1px solid #000}
.rar{display:inline-block;font-size:10px;color:var(--ink);padding:0 4px;border-radius:3px;border:1px solid #000;font-weight:700;line-height:14px}
.gembar{display:flex;align-items:center;gap:6px;background:#e6e0d0;border:2px solid var(--ink);border-radius:6px;padding:6px 8px;font-size:15px}
.gembar img{width:16px;height:16px}.gembar button{margin-left:auto;flex-direction:row;padding:3px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.pc small img{width:10px;height:10px;display:inline;margin:0;vertical-align:middle}
.chip{padding:3px 5px}
.splash{position:fixed;inset:0;z-index:50;background:#12131f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s}
.splash.out{opacity:0;pointer-events:none}
.splash b{font-size:30px;color:#e22511;letter-spacing:3px;text-shadow:3px 3px 0 #000}
.splash small{color:var(--mist);font-size:14px;letter-spacing:4px}
.legal{font-size:13px;line-height:1.45;color:var(--ink)}.legal h4{font-size:15px;margin:10px 0 3px}.legal p{margin-bottom:6px}
.setrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.setrow button{flex:1;flex-direction:row;justify-content:center;font-size:13px;padding:6px;box-shadow:0 3px 0 var(--ink);min-width:120px}
.ver{font-size:11px;color:var(--slate);text-align:center;margin-top:10px}
button:focus{outline:none}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:300px}.langs button{flex-direction:row;font-size:11px;padding:2px 7px;box-shadow:0 2px 0 var(--ink)}
</style>

!","ليكن صديقك الأول قطًا أو كلبًا. مع اكتساب الخبرة ستصل أنواع أخرى وسلالات نادرة إلى الملجأ!","Ton premier compagnon sera un chat ou un chien. Avec l'expérience, d'autres espèces et des races rares arriveront au refuge !","Dein erster Freund ist eine Katze oder ein Hund. Mit mehr Erfahrung kommen andere Arten und seltene Rassen ins Tierheim!","Tu primer amigo será un gato o un perro. ¡Con experiencia llegarán otras especies y razas raras al refugio!"],"elmasın var":["gems","جواهر لديك","gemmes","Edelsteine","gemas"],"Elmas al":["Get gems","احصل على جواهر","Obtenir des gemmes","Edelsteine holen","Conseguir gemas"],"Egzotik dostlar elmasla alınır. Bakımları daha zor ama mutluyken 2 kat altın kazandırırlar.":["Exotic pets cost gems. They are harder to care for, but happy ones earn double coins.","تُشترى الحيوانات الغريبة بالجواهر. رعايتها أصعب لكنها تمنح ضعف العملات حين تكون سعيدة.","Les animaux exotiques s'achètent en gemmes. Plus exigeants, mais heureux ils rapportent le double de pièces.","Exoten kosten Edelsteine. Sie sind anspruchsvoller, bringen glücklich aber doppelt Münzen.","Las mascotas exóticas cuestan gemas. Son más exigentes, pero felices dan el doble de monedas."],"Bugün barınakta bunlar var. Her gün yenileri gelir; nadir cinsler seyrek düşer!":["Here's who is at the shelter today. New ones arrive daily; rare breeds are scarce!","هؤلاء في الملجأ اليوم. يصل جدد كل يوم؛ والسلالات النادرة قليلة!","Voici qui est au refuge aujourd'hui. De nouveaux arrivent chaque jour ; les races rares sont rares !","Das ist heute im Tierheim. Täglich kommen neue; seltene Rassen sind rar!","Esto hay hoy en el refugio. ¡Llegan nuevos cada día; las razas raras escasean!"],"Barınağı yenile":["Refresh shelter","حدّث الملجأ","Renouveler le refuge","Tierheim auffrischen","Renovar refugio"],"Kedi ve köpeğin yanında, seviyen arttıkça hamster, balık, kuş, tavşan ve sincap da gelir. Egzotik türler mağazadaki Egzotik dükkanda.":["Besides cats and dogs, hamsters, fish, birds, rabbits and squirrels arrive as you level up. Exotic species are in the Exotic shop.","إلى جانب القطط والكلاب، تصل الهامستر والأسماك والطيور والأرانب والسناجب مع ارتفاع مستواك. الأنواع الغريبة في متجر الحيوانات الغريبة.","En plus des chats et chiens, hamsters, poissons, oiseaux, lapins et écureuils arrivent avec les niveaux. Les exotiques sont à la boutique exotique.","Neben Katzen und Hunden kommen mit höherem Level Hamster, Fische, Vögel, Hasen und Eichhörnchen. Exoten gibt es im Exotenladen.","Además de gatos y perros, con los niveles llegan hámsters, peces, pájaros, conejos y ardillas. Los exóticos están en la tienda exótica."],"Gelme olasılıkları:":["Odds:","احتمالات الوصول:","Probabilités :","Wahrscheinlichkeiten:","Probabilidades:"],"Her birinin kendine has bir huyu var. Hangisi seninle gelsin?":["Each one has its own personality. Who comes home with you?","لكل واحد طبعه الخاص. من سيأتي معك؟","Chacun a son caractère. Qui vient avec toi ?","Jeder hat seinen eigenen Charakter. Wer kommt mit?","Cada uno tiene su carácter. ¿Quién viene contigo?"],"Geri":["Back","رجوع","Retour","Zurück","Atrás"],"Devam":["Next","التالي","Suivant","Weiter","Siguiente"],"Ona bir isim ver:":["Give it a name:","أعطه اسمًا:","Donne-lui un nom :","Gib ihm einen Namen:","Ponle un nombre:"],"Rastgele":["Random","عشوائي","Au hasard","Zufällig","Al azar"],"Sahiplen":["Adopt","تبنَّ","Adopter","Adoptieren","Adoptar"],"Bir isim yaz":["Type a name","اكتب اسمًا","Écris un nom","Gib einen Namen ein","Escribe un nombre"],"Bu tür henüz kilitli":["This species is still locked","هذا النوع ما زال مقفلًا","Cette espèce est encore verrouillée","Diese Art ist noch gesperrt","Esta especie aún está bloqueada"],"Yeterli altının yok":["Not enough coins","لا تملك عملات كافية","Pas assez de pièces","Nicht genug Münzen","No tienes suficientes monedas"],"Yeterli elmasın yok":["Not enough gems","لا تملك جواهر كافية","Pas assez de gemmes","Nicht genug Edelsteine","No tienes suficientes gemas"],"Kedi":["Cat","قطة","Chat","K e room when happy.","يعيش في قفص ويطير في الغرفة حين يكون سعيدًا.","Vit en cage, vole dans la pièce quand il est heureux.","Lebt im Käfig, fliegt glücklich durchs Zimmer.","Vive en una jaula y vuela por la sala cuando está feliz."],"Yumuşacık ve utangaç. Bahçede çok mutlu.":["Soft and shy. Very happy in the garden.","ناعم وخجول. سعيد جدًا في الحديقة.","Tout doux et timide. Très heureux au jardin.","Weich und schüchtern. Im Garten sehr glücklich.","Suave y tímido. Muy feliz en el jardín."],"Yerinde duramaz, her şeyi merak eder.":["Can't sit still, curious about everything.","لا يهدأ، فضولي تجاه كل شيء.","Ne tient pas en place, curieux de tout.","Kann nicht stillsitzen, neugierig auf alles.","No se está quieta, todo le da curiosidad."],"Dikenli ama tatlı. Geceleri daha hareketli.":["Prickly but sweet. More active at night.","شائك لكنه لطيف. أنشط في الليل.","Piquant mais adorable. Plus actif la nuit.","Stachelig, aber süß. Nachts aktiver.","Pinchudo pero dulce. Más activo de noche."],"Kocaman kulaklı çöl tilkisi. Bahçede kazıp altın bulur.":["Desert fox with huge ears. Digs up coins in the garden.","ثعلب صحراوي بأذنين ضخمتين. يحفر في الحديقة ويجد العملات.","Renard du désert aux grandes oreilles. Déterre des pièces au jardin.","Wüstenfuchs mit Riesenohren. Buddelt im Garten Münzen aus.","Zorro del desierto con orejas enormes. Desentierra monedas en el jardín."],"Teraryumda yaşar. Sessiz, sakin ve tüylü.":["Lives in the terrarium. Quiet, calm and fuzzy.","يعيش في التيراريوم. هادئ ووديع وكثيف الشعر.","Vit dans le terrarium. Discrète, calme et velue.","Lebt im Terrarium. Leise, ruhig und flauschig.","Vive en el terrario. Silenciosa, tranquila y peluda."],"Teraryumda kıvrılır. Az yer ama düzenli beslenmeli.":["Coils up in the terrarium. Eats little but needs regular meals.","يلتف في التيراريوم. يأكل قليلًا لكن يحتاج وجبات منتظمة.","S'enroule dans le terrarium. Mange peu mais régulièrement.","Rollt sich im Terrarium ein. Frisst wenig, aber regelmäßig.","Se enrosca en el terrario. Come poco pero con regularidad."],"Akvaryumun yeni patronu! Balıklar ondan çekinir, kale onları korur.":["The new boss of the aquarium! Fish are wary of it; the castle protects them.","الزعيم الجديد للحوض! الأسماك تخشاه والقلعة تحميها.","Le nouveau chef de l'aquarium ! Les poissons s'en méfient, le château les protège.","Der neue Boss im Aquarium! Fische meiden ihn, die Burg schützt sie.","¡El nuevo jefe del acuario! Los peces le temen; el castillo los protege."],"Ruh haline göre renk değiştirir: yeşilse mutlu!":["Changes colour with its mood: green means happy!","يغيّر لونه حسب مزاجه: الأخضر يعني السعادة!","Change de couleur selon son humeur : vert = heureux !","Wechselt die Farbe nach Laune: grün heißt glücklich!","Cambia de color según su ánimo: ¡verde es feliz!"],"Çok nadir ve çok sevimli. Bağı hızla güçlenir.":["Very rare and very cute. Bonds quickly.","نادرة جدًا ولطيفة جدًا. تقوى الرابطة معها بسرعة.","Très rare et très mignon. Se lie vite.","Sehr selten und sehr süß. Baut schnell Bindung auf.","Muy raro y muy tierno. Se encariña rápido."],"Orman":["Forest","الغابة","Forêt","Wald","Bosque"],"Kar":["Snow","الثلج","Neige","Schnee","Nieve"],"Kestane":["Chestnut","الكستناء","Châtaigne","Kastanie","Castaño"],"Çöl":["Desert","الصحراء","Désert","Wüste","Desierto"],"Bal":["Honey","العسل","Miel","Honig","Miel"],"Kahverengi":["Brown","بني","Brun","Braun","Marrón"],"Kobalt mavisi":["Cobalt blue","أزرق كوبالتي","Bleu cobalt","Kobaltblau","Azul cobalto"],"Mor":["Purple","بنفسجي","Violet","Lila","Morado"],"Mısır":["Corn","الذرة","Blé","Korn","Maíz"],"Zümrüt":["Emerald","زمردي","Émeraude","Smaragd","Esmeralda"],"Albino":["Albino","ألبينو","Albinos","Albino","Albino"],"Gri":["Grey","رمادي","Gris","Grau","Gris"],"Buz":["Ice","الجليد","Glace","Eis","Hielo"],"Kum":["Sand","الرمل","Sable","Sand","Arena"],"Peçeli":["Veiled","المحجّبة","Casqué","Jemen","Velado"],"Himalaya":["Himalaya","الهيمالايا","Himalaya","Himalaya","Himalaya"],"Ateş":["Fire","النار","Feu","Feuer","Fuego"] lter","بدأت الهامستر والأسماك تصل إلى الملجأ","Hamsters et poissons arrivent au refuge","Hamster und Fische kommen jetzt ins Tierheim","Ya llegan hámsters y peces al refugio"],"Barınağa kuşlar gelmeye başladı":["Birds are now arriving at the shelter","بدأت الطيور تصل إلى الملجأ","Les oiseaux arrivent au refuge","Vögel kommen jetzt ins Tierheim","Ya llegan pájaros al refugio"],"Barınağa tavşanlar geliyor; Egzotik dükkanda kirpi açıldı":["Rabbits are arriving at the shelter; the hedgehog unlocked in the Exotic shop","الأرانب تصل إلى الملجأ؛ وفُتح القنفذ في متجر الحيوانات الغريبة","Les lapins arrivent ; le hérisson est débloqué à la boutique exotique","Hasen kommen ins Tierheim; der Igel ist im Exotenladen frei","Llegan conejos; el erizo se desbloqueó en la tienda exótica"],"Barınağa sincaplar geliyor; Egzotik dükkanda tarantula açıldı":["Squirrels are arriving at the shelter; the tarantula unlocked in the Exotic shop","السناجب تصل إلى الملجأ؛ وفُتحت الرتيلاء في متجر الحيوانات الغريبة","Les écureuils arrivent ; la mygale est débloquée à la boutique exotique","Eichhörnchen kommen; die Vogelspinne ist im Exotenladen frei","Llegan ardillas; la tarántula se desbloqueó en la tienda exótica"],"Egzotik dükkanda fennek tilkisi ve mısır yılanı açıldı":["The fennec fox and corn snake unlocked in the Exotic shop","فُتح ثعلب الفنك وثعبان الذرة في متجر الحيوانات الغريبة","Fennec et serpent des blés débloqués à la boutique exotique","Wüstenfuchs und Kornnatter sind im Exotenladen frei","El zorro fénec y la serpiente del maíz se desbloquearon en la tienda exótica"],"Egzotik dükkanda bukalemun açıldı":["The chameleon unlocked in the Exotic shop","فُتحت الحرباء في متجر الحيوانات الغريبة","Le caméléon est débloqué à la boutique exotique","Das Chamäleon ist im Exotenladen frei","El camaleón se desbloqueó en la tienda exótica"],"Egzotik dükkanda bambu köpek balığı açıldı":["The bamboo shark unlocked in the Exotic shop","فُتح قرش الخيزران في متجر الحيوانات الغريبة","Le requin-bambou est débloqué à la boutique exotique","Der Bambushai ist im Exotenladen frei","El tiburón bambú se desbloqueó en la tienda exótica"],"Egzotik dükkanda kızıl panda açıldı":["The red panda unlocked in the Exotic shop","فُتحت الباندا الحمراء في متجر الحيوانات الغريبة","Le panda roux est débloqué à la boutique exotique","Der Rote Panda ist im Exotenladen frei","El panda rojo se desbloqueó en la tienda exótica"],"Barınakta yeni tür açıldı:":["New at the shelter:","جديد في الملجأ:","Nouveau au refuge :","Neu im Tierheim:","Novedad en el refugio:"],"Artık barınaktan yeni dost sahiplenebilirsin.":["You can now adopt new buddies at the shelter.","يمكنك الآن تبنّي أصدقاء جدد من الملجأ.","Tu peux maintenant adopter au refuge.","Du kannst jetzt im Tierheim adoptieren.","Ya puedes adoptar en el refugio."],"Bahçe mağazada!":["The garden is in the shop!","الحديقة في المتجر!","Le jardin est en boutique !","Der Garten ist im Laden!","¡El jardín está en la tienda!"],"Bu arada:":["Meanwhile:","في هذه الأثناء:","Pendant ce temps :","Inzwischen:","Mientras tanto:"],"Herkes iyi görünüyor.":["Everyone looks fine.","الجميع بخير.","Tout le monde va bien.","Allen geht es gut.","Todos parecen bien."],"Merhaba! Ben Flix! Bu mahallede kim ne yapıyor, hepsini bilirim. Bundan sonra senin rehberinim.":["Hi! I'm Flix! I know everyone in this neighbourhood. From now on I'm your guide.","مرحبًا! أنا فليكس! أعرف كل ما يحدث في هذا الحي. من الآن فصاعدًا أنا دليلك.","Salut ! Je suis Flix ! Je connais tout le monde dans le quartier. Désormais, je suis ton guide.","Hallo! Ich bin Flix! Ich kenne jeden in der Nachbarschaft. Ab jetzt bin ich dein Begleiter.","¡Hola! ¡Soy Flix! Conozco a todo el barrio. A partir de ahora seré tu guía."],"Burası artık senin evin. Ama bir şey eksik... Bir ev, içinde bir dost olmadan çok sessiz.":["This is your home now. But something's missing... A home is too quiet without a buddy.","هذا بيتك الآن. لكن ينقصه شيء... البيت هادئ جدًا من دون صديق.","Voici ta maison. Mais il manque quelque chose... Une maison sans compagnon, c'est trop calme.","Das ist jetzt dein Zuhause. Aber etwas fehlt... Ohne Freund ist ein Haus zu still.","Esta es tu casa. Pero falta algo... Una casa sin un amigo es demasiado silenciosa."],"Hadi barınağa gidelim. Seni bekleyen dostlar var!":["Let's go to the shelter. Buddies are waiting for you!","هيا إلى الملجأ. هناك أصدقاء ينتظرونك!","Allons au refuge. Des compagnons t'attendent !","Auf ins Tierheim. Freunde warten auf dich!","Vamos al refugio. ¡Hay amigos esperándote!"],"Barınağa git":["Go to the shelter","اذهب إلى الملجأ","Aller au refuge","Zum Tierheim","Ir al refugio"],"Paneldeki 4 çubuk dostunun ihtiyaçları: tokluk, mutluluk, temizlik ve enerji. Kalpler de aranızdaki bağı gösterir.":["The 4 bars on the panel are your buddy's needs: food, happiness, cleanliness and energy. The hearts show your bond.","الأشرطة الأربعة هي احتياجات صديقك: الشبع والسعادة والنظافة والطاقة. والقلوب تُظهر الرابطة بينكما.","Les 4 barres sont ses besoins : faim, bonheur, propreté et énergie. Les cœurs montrent votre lien.","Die 4 Balken sind seine Bedürfnisse: Sättigung, Glück, Sauberkeit und Energie. Die Herzen zeigen eure Bindung.","Las 4 barras son sus necesidades: hambre, felicidad, limpieza y energía. Los corazones muestran vuestro vínculo."],"Zaman gerçek saatle akar, sen yokken de! Yıka dersen gelip ben yıkarım, Oyna dersen top atarım.":["Time runs in real time, even when you're away! Tap Wash and I'll do the washing, tap Play and I'll throw a ball.","الوقت يمضي فعليًا حتى في غيابك! اضغط اغسل وسأغسله أنا، واضغط العب وسأرمي الكرة.","Le temps passe en vrai, même quand tu es absent ! Laver : je m'en charge. Jouer : je lance la balle.","Die Zeit läuft echt weiter, auch ohne dich! Bei Waschen wasche ich, bei Spielen werfe ich den Ball.","¡El tiempo pasa de verdad, incluso sin ti! Pulsa Bañar y lo baño yo; pulsa Jugar y lanzo la pelota."],"Hadi birlikte oynayalım. \"Oyna\"ya bas!":["Let's play together. Tap \"Play\"!","هيا نلعب معًا. اضغط \"العب\"!","Jouons ensemble. Appuie sur « Jouer » !","Lass uns spielen. Tippe auf „Spielen“!","Juguemos juntos. ¡Pulsa «Jugar»!"],"Harika gidiyorsun! Sana 40 altın hediye. Mağazadan ilk oyuncağını al.":["You're doing great! Here are 40 coins. Buy your first toy in the shop.","أداء رائع! هذه 40 عملة هدية. اشترِ أول لعبة من المتجر.","Super ! Voici 40 pièces. Achète ton premier jouet à la boutique.","Super! Hier sind 40 Münzen. Kauf im Laden dein erstes Spielzeug.","¡Lo haces genial! Toma 40 monedas. Compra tu primer juguete en la tienda."],"Tecrübe kazandıkça barınağa hamster, balık, kuş, tavşan ve sincap da gelecek. Bazen Sfenks kedisi gibi nadir cinsler düşer, gelince haber veririm!":["As you gain experience, hamsters, fish, birds, rabbits and squirrels will come to the shelter. Rare breeds like the Sphynx show up sometimes, I'll tell you!","مع اكتساب الخبرة ستصل الهامستر والأسماك والطيور والأرانب والسناجب. وأحيانًا تظهر سلالات نادرة مثل السفينكس، وسأخبرك!","Avec l'expérience, hamsters, poissons, oiseaux, lapins et écureuils arriveront au refuge. Des races rares comme le Sphynx passent parfois, je te préviendrai !","Mit mehr Erfahrung kommen Hamster, Fische, Vögel, Hasen und Eichhörnchen. Manchmal tauchen seltene Rassen wie die Sphynx auf, ich sag dir Bescheid!","Con experiencia llegarán hámsters, peces, pájaros, conejos y ardillas. A veces aparecen razas raras como la esfinge, ¡te avisaré!"],"Kirpi, tarantula, yılan, hatta köpek balığı gibi egzotik dostlar da var. Onlar Egzotik dükkanda, elmasla alınıyor.":["There are exotic pets too: hedgehog, tarantula, snake, even a shark. They're in the Exotic shop, bought with gems.","هناك حيوانات غريبة أيضًا: قنفذ ورتيلاء وثعبان وحتى قرش. تجدها في متجر الحيوانات الغريبة وتُشترى بالجواهر.","Il y a aussi des exotiques : hérisson, mygale, serpent, et même un requin. À la boutique exotique, en gemmes.","Es gibt auch Exoten: Igel, Vogelspinne, Schlange, sogar ein Hai. Im Exotenladen, gegen Edelsteine.","También hay exóticos: erizo, tarántula, serpiente, ¡incluso un tiburón! Están en la tienda exótica, con gemas."],"Her gün yeni görevler var. Bir de \"Flix Topu\" oyununu dene: topu ne kadar sektirirsen o kadar altın!":["New tasks every day. And try \"Flix Ball\": the more you juggle, the more coins!","هناك مهام جديدة كل يوم. وجرّب \"كرة فليكس\": كلما ركلت الكرة أكثر ربحت عملات أكثر!","De nouvelles missions chaque jour. Essaie aussi « Balle Flix » : plus tu jongles, plus tu gagnes !","Jeden Tag neue Aufgaben. Probier „Flix-Ball“: je mehr du jonglierst, desto mehr Münzen!","Cada día hay misiones nuevas. Y prueba «Pelota Flix»: ¡cuanto más la mantengas, más monedas!"],"Son bir şey: Uzun süre ilgisiz kalan dostlar evden kaçar. Kaçarsa 24 saat içinde bulman gerekir... Ben hep yakındayım. Görüşürüz!":["One last thing: pets left alone too long run away. Then you have 24 hours to find them... I'm always nearby. See you!","أمر أخير: الحيوانات المهملة طويلًا تهرب من البيت. وعندها لديك 24 ساعة لتجدها... أنا دائمًا قريب. إلى اللقاء!","Dernière chose : un animal trop longtemps délaissé s'enfuit. Tu as alors 24 h pour le retrouver... Je suis toujours dans le coin. À plus !","Eins noch: Zu lange allein gelassene Tiere laufen weg. Dann hast du 24 Stunden, sie zu finden... Ich bin immer in der Nähe. Bis dann!","Una última cosa: las mascotas desatendidas mucho tiempo se escapan. Tendrás 24 horas para encontrarlas... Siempre estoy cerca. ¡Hasta luego!"],"Dostların acıkınca ya da barınağa nadir biri gelince sana haber vereyim mi?":["Shall I let you know when your pets get hungry or a rare one arrives at the shelter?","هل أخبرك حين تجوع حيواناتك أو يصل حيوان نادر إلى الملجأ؟","Je te préviens quand tes animaux ont faim ou qu'un rare arrive au refuge ?","Soll ich Bescheid sagen, wenn deine Tiere Hunger haben oder ein seltenes ankommt?","¿Te aviso cuando tus mascotas tengan hambre o llegue una rara al refugio?"],"Evet, haber ver":["Yes, tell me","نعم، أخبرني","Oui, préviens-moi","Ja, gern","Sí, avísame"],"Şimdi değil":["No function drawSpr(c,rows,map,x,y,flip,k=1){
  const h=rows.length,w=rows[0].length;
  for(let r=0;r<h;r++){const row=rows[r];for(let i=0;i<w;i++){const ch=row[i];if(ch==='.')continue;const col=map[ch];if(!col)continue;
    c.fillStyle=col;c.fillRect(Math.round(x+(flip?w-1-i:i)*k),Math.round(y+r*k),k,k);}}
}
function genSpr(kind,coat,f){
  const D=GEN[kind],W=D.w+2,H=D.h+2;let g=[...Array(H)].map(()=>Array(W).fill(null));
  const C=c=>coat[c]||c;
  const run=(list,tg)=>list.forEach(q=>{const t=q[0];const put=(x,y,c)=>{if(x>=0&&y>=0&&x<W&&y<H)tg[y][x]=c;};
    if(t==='e'){const[,cx,cy,rx,ry,c]=q;for(let y=-1;y<=D.h;y++)for(let x=-1;x<=D.w;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)put(x+1,y+1,C(c));}}
    else if(t==='r'){const[,x0,y0,w,h,c]=q;for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)put(x+1,y+1,C(c));}
    else if(t==='p')put(q[1]+1,q[2]+1,C(q[3]));
    else if(t==='x'){const[,x0,y0,w,h]=q;for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)put(x+1,y+1,null);}});
  run(D.parts(f),g);
  const o=g.map(r=>r.slice());
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!g[y][x]&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>g[y+b]&&g[y+b][x+a]))o[y][x]='#1a1c2c';
  run(D.det(f),o);
  if(f==='Z'&&D.lh){for(let i=0;i<D.lh;i++){o.pop();o.unshift(Array(W).fill(null));}}
  const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',map={},rev={};let n=0;
  const rows=o.map(r=>r.map(c=>{if(!c)return '.';if(!rev[c]){rev[c]=chars[n++];map[rev[c]]=c;}return rev[c];}).join(''));
  return {rows,map};
}

// ================= SIMULATION =================
function decay(p,gm){
  if(!alive(p))return;
  const sl=p.state==='sleep',gard=p.room==='bahce',h=hab(p);
  p.hunger=clamp(p.hunger-gm*(sl?.08:.2)*tm(p,'hungerDecay')*rate(p,'h'));
  p.clean=clamp(p.clean-gm*.09*rate(p,'c')*(gard?1.3:1));
  p.energy=clamp(p.energy+(sl?gm*.42*tm(p,'sleepGain'):-gm*.13*tm(p,'energyDecay')*rate(p,'e')*(p.sick?1.5:1)));
  let hd=.1;if(p.hunger<30)hd+=.15;if(p.clean<30)hd+=.08;if(p.energy<15)hd+=.06;if(p.sick)hd+=.15;
  if(h==='floor')hd+=S.dirt.filter(d=>d.room===p.room).length*.02;
  if(p.trait==='nazli'&&S.gm-p.lastPetT>180)hd*=1.3;
  if(S.toys.some(t=>likes(t.id,p)&&(TOYS[t.id].hab||t.room===p.room)))hd*=.8;
  if(p.trait==='sosyal'&&S.pets.filter(q=>q!==p&&alive(q)&&q.room===p.room).length)hd*=.7;
  if(p.kind==='fish'&&S.pets.some(q=>q.kind==='shark'&&alive(q))&&!S.toys.some(t=>t.id==='castle'))hd*=1.4;
  if(gard)hd*=['dog','rabbit','fennec','squirrel'].includes(p.kind)?.7:.9;
  hd*=tm(p,'happyDecay')*rate(p,'hp');
  if(!sl)p.happy=clamp(p.happy-gm*hd);
  if(p.clean<15&&!p.sick){p.sickAcc+=gm;if(p.sickAcc>120){p.sick=true;p.sickAcc=0;
    if(S.ev)S.ev.push(`${p.name} hastalandı`);else say(`${p.name} hastalandı! Uzun süre kirli kaldı. Mağazadan ilaç alalım, ben veririm.`,{urgent:true});}}
  else if(p.clean>=15)p.sickAcc=Math.max(0,p.sickAcc-gm);
  const bad=p.happy<25&&(p.hunger<25||p.clean<25||p.sick);
  p.neglect=bad?p.neglect+gm:Math.max(0,p.neglect-gm*3);
  const limit=180*tm(p,'patience')+60*(bondLv(p)-1);
  if(p.neglect>limit*.35&&p.warned<1){p.warned=1;if(!S.ev){
    say(isBox(h)?`${p.name} çok mutsuz, ${h==='tank'?'akvaryum':'teraryum'} da kirli... Böyle giderse onu daha iyi bakılacağı bir yere vermem gerekecek!`:
      h==='cage'?`${p.name} durmadan pencereye bakıyor... İlgilenmezsek uçup gidebilir!`:`${p.name} çok mutsuz, kapıya bakıp duruyor... İhtiyaçlarına bakmazsak evden kaçabilir!`,{urgent:true});
    blip(220,.25,'triangle',.07);}}
  if(p.neglect<10)p.warned=0;
  if(p.neglect>limit&&!sl&&p.state!=='care'){
    if(isBox(h)||S.ev){p.state='lost';p.lostLeft=1440;p.room='salon';p.out=false;p.lostMode=isBox(h)?'shelter':'run';
      if(S.ev)S.ev.push(isBox(h)?`${p.name} bakımevine emanet edildi`:`${p.name} evden kaçtı`);
      else{say(`${p.name}'e iyi bakamadık... Onu ${h==='tank'?'akvaryum dükkanına':'egzotik hayvan bakımevine'} emanet ettim. 24 saat içinde geri alabilirsin.`,{urgent:true});jingle([523,392,330,262]);}}
    else if(h==='cage'){p.out=true;goAny(p,WINDOW.x,WINDOW.y,'leave');p.state='leaving';}
    else{const [x,y]=EXIT[p.room].front;goTo(p,x,y,'leave');p.state='leaving';}
  }
}
function simGame(gm){
  S.gm+=gm;if(S.tut<99)return;
  S.pets.forEach(p=>{decay(p,gm);
    if(p.state==='lost'){p.lostLeft-=gm;if(p.searchCD>0)p.searchCD-=gm;
      if(p.lostLeft<=0){p.state='gone';if(S.ev)S.ev.push(`${p.name} geri dönmedi`);
        else{say(`${p.name} geri dönmedi... Onu kaybettik. Duvara fotoğrafını astım. Diğer dostlarımıza daha iyi bakalım, olur mu?`,{urgent:true});jingle([392,330,262,196]);}
        if(S.sel===p.id){const n=S.pets.find(alive);S.sel=n?n.id:null;}}}
  });
  const hp=S.pets.filter(p=>alive(p)&&p.happy>60).reduce((a,p)=>a+(SP[p.kind].ex?2:1),0);
  S.coinAcc+=gm*hp/30;if(S.coinAcc>=1){const n=Math.floor(S.coinAcc);S.coins+=n;S.coinAcc-=n;}
  S.pets.filter(p=>alive(p)&&hab(p)==='floor'&&p.clean<50).forEach(p=>{if(S.dirt.length<8&&Math.random()<gm*.008)S.dirt.push({x:24+Math.random()*112,y:94+Math.random()*22,room:p.room});});
  const al=S.pets.filter(alive);if(al.length&&al.every(p=>p.happy>=80))S.dayHappy=true;
}
function likedToy(p){const l=S.toys.filter(t=>!TOYS[t.id].hab&&t.room===p.room&&likes(t.id,p));return l.length?rnd(l):null;}
function sleepy(p){return p.energy<20||(isNight()&&p.trait!=='gece'&&p.energy<70)||(p.trait==='gece'&&!isNight()&&p.energy<45);}
function think(p){
  const h=hab(p);
  if(p.sick)bubble(p,'sick');
  if(h==='terra'){
    if(sleepy(p)){goSleep(p);return;}
    const fy=TERRA.y+TERRA.h-2;
    if(S.bowls[p.id]&&p.hunger<95){goAny(p,TERRA.x+TERRA.w/2,fy,'eat');return;}
    if(p.hunger<30)bubble(p,'bowl');else if(p.clean<30)bubble(p,'drop');
    goAny(p,TERRA.x+8+Math.random()*(TERRA.w-14),fy,null);return;}
  if(h==='tank'){
    if(sleepy(p)){goSleep(p);return;}
    if(p.kind==='fish'){const sh=S.pets.find(q=>q.kind==='shark'&&alive(q));if(sh&&Math.abs(sh.x-p.x)<10&&Math.random()<.5){bubble(p,'alert',1.5);goAny(p,sh.x<TANK.x+14?TANK.x+TANK.w-5:TANK.x+6,p.y,null);return;}}
    if(S.bowls[p.id]&&p.hunger<95){goAny(p,TANK.x+8+Math.random()*12,TANK.y+12,'eat');return;}
    if(p.hunger<30)bubble(p,'bowl');else if(p.clean<30)bubble(p,'drop');
    if(Math.random()<.3)puff(p.x+p.dir*6,p.y-6,'bub',1,{room:'salon',vy:-8,t:1.4});
    goAny(p,TANK.x+8+Math.random()*(TANK.w-14),TANK.y+12+Math.random()*(TANK.h-14),null);return;}
  if(h==='cage'){
    const [px,py]=perchPos(p);
    if(sleepy(p)){goSleep(p);return;}
    if(S.bowls[p.id]&&p.hunger<95){goAny(p,CAGE.x+CAGE.w-8,py,'eat');p.out=false;return;}
    if(p.hunger<30)bubble(p,'bowl');else if(p.happy<30)bubble(p,'broken');
    if(!p.out&&p.happy>45&&Math.random()<.3&&S.view==='salon'){p.out=true;goAny(p,14+Math.random()*130,16+Math.random()*58,null);return;}
    if(p.out){if(Math.random()<.4)goAny(p,px,py,'home');else goAny(p,14+Math.random()*130,16+Math.random()*58,null);return;}
    if(Math.random()<.3)puff(p.x,p.y-12,'note',1,{room:'salon',vy:-10});
    goAny(p,px+(Math.random()*6-3),py,null);return;}
  if(sleepy(p)){goSleep(p);return;}
  if(p.hunger<60&&S.bowls[p.id]){goEat(p);return;}
  if(!p.sick){if(p.hunger<30&&!S.bowls[p.id])bubble(p,'bowl');else if(p.clean<30)bubble(p,'drop');else if(p.happy<30)bubble(p,'broken');}
  const r=Math.random();
  if(p.room==='bahce'&&['dog','fennec','squirrel','rabbit'].includes(p.kind)&&r<.16){p.state='dig';p.timer=2.4;return;}
  if(p.kind==='cat'&&p.room==='salon'&&r<.1&&S.pets.some(q=>alive(q)&&hab(q)==='cage'&&!q.out)){goTo(p,CAGE.x+CAGE.w/2,88,'stare');return;}
  if(S.garden&&r<(p.kind==='dog'||p.kind==='rabbit'?.18:.08)){toRoom(p,p.room==='salon'?'bahce':'salon',()=>{p.state='idle';p.timer=1;});return;}
  if(r<.42){const t=likedToy(p);if(t){goTo(p,t.x+(Math.random()<.5?-18:18),t.y,{toy:t.id});return;}}
  const others=S.pets.filter(o=>o!==p&&o.room===p.room&&o.state==='idle'&&hab(o)==='floor');
  if(r<.62&&others.length){const o=rnd(others);const mx=(p.x+o.x)/2,my=(p.y+o.y)/2;goTo(p,mx-16,my,{meet:o.id});goTo(o,mx+16,my,{meet:p.id});return;}
  if(p.neglect>60&&Math.random()<.5){const [x,y]=EXIT[p.room].front;goTo(p,x-18,y,null);return;}

function arrive(p){

function updatePet(p,dt){

      const sp=(h==='tank'?(p.kind==='shark'?16:11):h==='terra'?(p.kind==='snake'?6:4):h==='cage'?(p.out||p.state==='leaving'?42:16):(p.state==='leaving'?12:SP[p.kind].spd))*dt;

    case 'dig':p.timer-=dt;if(vis&&Math.random()<dt*10)puff(p.x+p.dir*8,p.y-2,'dirt',1,{vy:-16,g:80,t:.5,room:p.room});

    case 'social':case 'treat':case 'stare':p.timer-=dt;if(p.timer<=0){p.state='idle';p.timer=1.5+Math.random()*2;}break;
    case 'care':p.dir=hab(p)==='floor'?(F.x>p.x?1:-1):p.dir;if(!F.job||F.job.pet!==p.id){if(!F.jobs.some(j=>j.pet===p.id)){p.state='idle';p.timer=1;}}break;

      say(h==='cage'?`Eyvah! ${p.name} açık pencereden uçup gitti! 24 saat içinde onu bulmalıyız. Paneldeki "Ara" butonuna bas!`:
        `Eyvah! ${p.name} kaçtı! Kapıya kayıp ilanı astım. 24 saat içinde onu bulmamız lazım. Paneldeki "Ara" butonuna bas!`,{urgent:true});jingle([523,392,330,262]);}break;
  }
}

function petBox(p){const d=dims(p);return {x0:p.x-d.w/2-2,x1:p.x+d.w/2+2,y0:p.y-d.h-2,y1:p.y+3};}
cv.addEventListener('pointerdown',ev=>{
  if(!S.started)return;
  const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*160,y=(ev.clientY-r.top)/r.height*120;
  if((F.state==='idle'||F.state==='job')&&F.room===S.view&&Math.abs(F.x-x)<16&&y>F.y-44&&y<F.y+3&&D.cur){talkEl.click();return;}
  const di=S.dirt.findIndex(d=>d.room===S.view&&Math.abs(d.x+2-x)<6&&Math.abs(d.y-y)<6);
  if(di>=0){S.dirt.splice(di,1);S.coins++;S.c.dirt++;addXP(1);puff(x,y-3,'coin');blip(1200,.05);refresh();return;}
  let hit=S.pets.filter(p=>p.room===S.view&&alive(p)).sort((a,b)=>(hab(b)==='floor')-(hab(a)==='floor')||b.y-a.y).find(p=>{const b=petBox(p);return x>b.x0&&x<b.x1&&y>b.y0&&y<b.y1;});
  if(!hit&&S.view==='salon'){
    const inB=b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h;
    const which=inB(TANK)?'tank':inB(TERRA)?'terra':inB(CAGE)?'cage':'-';
    const grp=S.pets.filter(p=>alive(p)&&hab(p)===which);
    if(grp.length){const i=grp.findIndex(p=>p.id===S.sel);hit=grp[(i+1)%grp.length];if(i>=0&&grp.length===1)hit=grp[0];}
  }
  if(hit){if(S.sel===hit.id){wake(hit);petIt(hit);}else{S.sel=hit.id;blip(740,.04);}refresh();return;}
  const p=sel();if(p&&alive(p)&&hab(p)==='floor'&&p.room===S.view&&y>84&&!['sleep','care'].includes(p.state)){goTo(p,x,y,null);blip(600,.03);}
});
function petIt(p){

// ---- shelter (rotating, with rarities) ----
const shelterSize=()=>Math.min(6,4+Math.floor(S.level/4));
function rollRar(){let r=Math.random()*100;for(let i=RAR.length-1;i>=0;i--){/* rare first */}
  if(r<RAR[3].w)return 3;r-=RAR[3].w;if(r<RAR[2].w)return 2;r-=RAR[2].w;if(r<RAR[1].w)return 1;return 0;}
function rollAnimal(minRar){
  const kinds=Object.keys(BREEDS).filter(k=>SP[k].lv<=S.level);const kind=rnd(kinds);
  let rr=Math.max(minRar||0,rollRar());let opts=BREEDS[kind].filter(b=>b.r===rr);
  while(!opts.length&&rr>0){rr--;opts=BREEDS[kind].filter(b=>b.r===rr);}
  const br=rnd(opts);
  return {id:Math.random().toString(36).slice(2,8),kind,breed:br.n,rar:br.r,coat:br.coat,trait:rnd(SP[kind].tr)};
}
function announce(a){
  if(a.rar>=2){S.shelterNews=true;
    say(a.rar===3?`Haber var! Barınağa EFSANEVİ bir ${a.breed} geldi! Çok nadir gelir, kaçırma!`:`Barınağa nadir bir ${a.breed} geldi! Yarın gitmiş olabilir, bir göz at.`,{urgent:a.rar===3});
    jingle(a.rar===3?[784,988,1175,1568]:[784,988,1175]);toast(`Barınakta ${RAR[a.rar].n.toLowerCase()}: ${a.breed}!`);}
}
function fillShelter(n,news){for(let i=0;i<n;i++){const a=rollAnimal();if(S.shelter.length>=shelterSize()){const ci=S.shelter.findIndex(x=>x.rar===0);S.shelter.splice(ci>=0?ci:0,1);}S.shelter.push(a);if(news)announce(a);}}
function newShelterDay(quiet){S.shelterDay=dayIdx();S.shelter=[];for(let i=0;i<shelterSize();i++)S.shelter.push(rollAnimal());S.nextArrival=S.gm+180+Math.random()*240;
  const best=S.shelter.reduce((m,a)=>a.rar>m.rar?a:m,S.shelter[0]);if(!quiet&&best&&best.rar>=2)announce(best);}
function shelterTick(){
  if(S.tut<99||S.level<2)return;
  if(!S.shelter||S.shelterDay!==dayIdx()){newShelterDay(false);return;}
  if(S.gm>=S.nextArrival){S.nextArrival=S.gm+180+Math.random()*240;fillShelter(1,true);}
}

function queueTut(){D.q=[];TUT.forEach((m,i)=>{if(i<S.tut-1)return;say(m.text,Object.assign({},m,{after:()=>{S.tut=i+2;if(i===TUT.length-1){S.tut=99;newDay(true);addXP(5);if(NATIVE&&NAT()&&NAT().notify&&S.notif===undefined)say('Dostların acıkınca ya da barınağa nadir biri gelince sana haber vereyim mi?',{choices:[{l:'Evet, haber ver',fn:()=>askNotif(false)},{l:'Şimdi değil',fn:()=>{S.notif=false;save();}}]});}save();}}));});}

if(!S){S=fresh();S.startDay=dayIdx();}
else{
  if(S.startDay===undefined)S.startDay=dayIdx();
  bStart.textContent='Devam et';
  const w=catchUp();if(w)S._welcome=w;
}
// Time passes while the game is closed or in the background: simulate it in 5-minute steps (max 48 h).
function catchUp(){
  const away=Math.min(2880,Math.max(0,(Date.now()-S.lastTs)/60000));S.lastTs=Date.now();
  if(S.tut>=99&&away>3){S.ev=[];let left=away;while(left>0){const st=Math.min(5,left);simGame(st);left-=st;}const ev=S.ev;delete S.ev;
    S.pets.forEach(p=>{if(alive(p)&&p.state!=='sleep'&&p.state!=='care'){p.goal=null;p.state='idle';p.timer=1;}});
    const needy=S.pets.filter(p=>alive(p)&&(p.hunger<35||p.happy<35||p.clean<30||p.sick)).map(p=>p.name);
    return tr(`Tekrar hoş geldin! Sen yokken ${fmtH(away)} geçti.`)+(ev.length?' '+tr('Bu arada:')+' '+ev.map(tr).join(', ')+'.':'')+' '+(needy.length?tr(`${needy.join(', ')} ilgini bekliyor.`):tr('Herkes iyi görünüyor.'));}
  S.gm+=away;return null;
}
S.pets.forEach(p=>{
  if(!SP[p.kind])p.kind='cat';if(!TR[p.trait])p.trait=SP[p.kind].tr[0];
  if(p.state==='gone_out'||p.state==='leaving'){p.state='lost';p.lostMode=isBox(hab(p))?'shelter':'run';p.lostLeft=p.lostLeft||1440;p.room='salon';}
  if(alive(p)){p.goal=null;p.hop=0;
    if(hab(p)==='cage'){p.out=false;const [x,y]=perchPos(p);p.x=x;p.y=y;}
    if(isBox(hab(p))){const b=boxOf(p);p.x=clamp(p.x,b.x+8,b.x+b.w-6);p.y=hab(p)==='terra'?b.y+b.h-2:clamp(p.y,b.y+12,b.y+b.h-2);}
    if(p.state!=='sleep'){p.state='idle';p.timer=1;}}
});
S.doorOpen=0;S.winOpen=0;S.started=false;
bStart.onclick=()=>{S.started=true;titleEl.classList.add('hidden');blip(660,.06);setTimeout(()=>blip(990,.08),80);
  if(S.tut<99){if(S.tut===0)S.tut=1;if(S.tut>3&&!S.pets.length)S.tut=3;queueTut();}
  else{if(S._welcome){say(S._welcome);delete S._welcome;}if(S.taskDay!==dayIdx())newDay(false);}
  refresh();};
refresh();

let last=performance.now(),uiT=0,saveT=0,visitT=0;
const TIPS=['Kediler banyoyu sevmez ama köpekler bayılır.','Ödül maması bağı hızlı güçlendirir.','Yerdeki kirlere dokunarak temizleyebilirsin, her biri 1 altın!',
  'Dostlar birbiriyle de oynar. Ama ikisi de huysuzsa kavga çıkar!','Sevdiği oyuncak odadaysa bir dost daha geç mutsuz olur.','Geceleri dostlar kendiliğinden yatağa gider.',
  'Bağ seviyesi yüksek dostlar ihmale daha uzun dayanır.','Uzun süre kirli kalan dostlar hastalanabilir.','Balıkların suyu çabuk kirlenir, akvaryumu sık temizle.',
  'Kediler kafesteki kuşa göz dikebilir, kuş da hiç hoşlanmaz!','Bukalemunun rengine bak: yeşilse mutlu, kahverengiyse dertli.','Fennek tilkisi bahçede kazı yaparak altın bulur.'];
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(S.started){
    simGame(dt/60*S.speed);
    S.pets.forEach(p=>updatePet(p,dt));
    if(S.doorOpen>0)S.doorOpen-=dt;if(S.winOpen>0)S.winOpen-=dt;
    if(S.tut>=99&&S.taskDay!==dayIdx())newDay(false);
    shelterTick();
    visitT+=dt;if(visitT>150){visitT=0;if(S.tut>=99&&!flixWants()&&S.pets.some(alive))say(rnd(TIPS));}
    S.pets.forEach(p=>{if(!alive(p))return;if(p.hunger<20&&!p.wh){p.wh=1;say(`${p.name} çok acıktı! "Besle"ye bas, mamasını koyayım.`);}if(p.hunger>40)p.wh=0;});
  }
  flixTick(dt);dlgTick(dt);
  if(srch){srch.t+=dt;if(srch.shakeT>0)srch.shakeT-=dt;drawPark();}
  kickTick(dt);
  render(now/1000,dt);
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on');}
  uiT+=dt;if(uiT>.35){uiT=0;refresh();}
  saveT+=dt;if(saveT>4){saveT=0;if(S.started)save();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  if(document.hidden){if(S.started){save();scheduleNotifs();}}

});
